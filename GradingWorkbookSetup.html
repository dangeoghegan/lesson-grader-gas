<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 20px;
        color: #333;
      }
      h2 {
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 20px;
        color: #1a73e8;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        font-size: 14px;
      }
      select, input[type="text"], input[type="number"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 14px;
      }
      .combo-box {
        display: flex;
        gap: 10px;
      }
      .combo-box select {
        flex: 1;
      }
      .combo-box input {
        flex: 1;
      }
      button {
        background-color: #1a73e8;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        width: 100%;
        margin-top: 10px;
      }
      button:hover {
        background-color: #1557b0;
      }
      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      #status {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        display: none;
        font-size: 13px;
      }
      .success { background-color: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
      .error { background-color: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
      .help-text {
        font-size: 12px;
        color: #666;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h2>Create / Open Grading Workbook</h2>

    <div class="form-group">
      <label for="course">Course Code</label>
      <div class="combo-box">
        <select id="courseSelect">
          <option value="">-- Select Existing or Type New --</option>
        </select>
        <input type="text" id="courseInput" placeholder="e.g. 9DAT1">
      </div>
      <div class="help-text">Must start with 7/8 for Stage 4, 9/10 for Stage 5, 11/12 for Stage 6.</div>
    </div>

    <div class="form-group">
      <label for="task">Task Name</label>
      <div class="combo-box">
        <select id="taskSelect">
          <option value="">-- Select Existing or Type New --</option>
        </select>
        <input type="text" id="taskInput" placeholder="e.g. Jewellery Design">
      </div>
    </div>

    <div class="form-group">
      <label for="rubric">Rubric Selection</label>
      <select id="rubricSelect">
        <option value="">-- No Rubric --</option>
        <option value="__UPLOAD__">+ Upload Rubric Document</option>
      </select>
      <div id="uploadContainer" style="display:none; margin-top:8px;">
        <input type="text" id="newRubricInput" placeholder="New Rubric Name" style="margin-bottom:8px;">
        <input type="file" id="rubricDocumentInput" accept=".pdf,.md,.txt,application/pdf,text/markdown,text/plain">
        <div class="help-text">Upload a PDF or Markdown rubric. The system will create an editable Rubric tab and a hidden machine-readable Criteria tab.</div>
      </div>
    </div>

    <div class="form-group">
      <label for="year">Year</label>
      <input type="number" id="year" required>
    </div>

    <button id="submitBtn">Create / Open Workbook</button>
    <button id="linkClassroomBtn" style="display:none; background-color:#34a853; margin-top:10px;">Link Classroom Assignment</button>

    <div id="status"></div>

    <script>
      let backendData = { courses: [], categories: [], tasks: [], sharedRubrics: [] };
      let lastCreatedCourseCode = '';
      let lastCreatedTaskName = '';

      window.onload = function() {
        document.getElementById('year').value = new Date().getFullYear();
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = 'Loading...';

        // Bind events
        document.getElementById('courseSelect').addEventListener('change', handleCourseSelect);
        document.getElementById('courseInput').addEventListener('input', function() {
          clearSelect('courseSelect');
          updateTaskDropdown();
        });

        document.getElementById('taskSelect').addEventListener('change', handleTaskSelect);
        document.getElementById('taskInput').addEventListener('input', function() {
          clearSelect('taskSelect');
        });

        document.getElementById('rubricSelect').addEventListener('change', handleRubricSelect);
        document.getElementById('year').addEventListener('change', updateCourseDropdown);
        document.getElementById('submitBtn').addEventListener('click', submitForm);
        document.getElementById('linkClassroomBtn').addEventListener('click', openCourseworkPicker);

        google.script.run
          .withSuccessHandler(function(data) {
            backendData = data;
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = 'Create / Open Workbook';
            updateCourseDropdown();
            populateRubricDropdown();
          })
          .withFailureHandler(showError)
          .apiGetGradingSetupData();
      };

      function populateRubricDropdown() {
        const select = document.getElementById('rubricSelect');
        // keep the first two default options, append the rest
        backendData.sharedRubrics.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r.id;
          opt.textContent = r.name;
          select.appendChild(opt);
        });
      }

      function handleRubricSelect() {
        const select = document.getElementById('rubricSelect');
        const container = document.getElementById('uploadContainer');
        if (select.value === '__UPLOAD__') {
          container.style.display = 'block';
        } else {
          container.style.display = 'none';
          document.getElementById('newRubricInput').value = '';
          document.getElementById('rubricDocumentInput').value = '';
        }
      }

      function updateCourseDropdown() {
        const year = document.getElementById('year').value;
        const select = document.getElementById('courseSelect');

        select.innerHTML = '<option value="">-- Select Existing or Type New --</option>';

        const filteredCourses = backendData.courses.filter(c => c.year.toString() === year);

        // Use a Set to ensure unique course codes in the dropdown
        const uniqueCourseCodes = new Set();
        filteredCourses.forEach(c => uniqueCourseCodes.add(c.courseCode));

        uniqueCourseCodes.forEach(code => {
          const opt = document.createElement('option');
          opt.value = code;
          opt.textContent = code;
          select.appendChild(opt);
        });

        document.getElementById('courseInput').value = '';
        updateTaskDropdown();
      }

      function handleCourseSelect() {
        const select = document.getElementById('courseSelect');
        const input = document.getElementById('courseInput');
        if (select.value) {
          input.value = select.value;
        }
        updateTaskDropdown();
      }

      function updateTaskDropdown() {
        const course = document.getElementById('courseInput').value.trim();
        const category = 'General';
        const select = document.getElementById('taskSelect');

        select.innerHTML = '<option value="">-- Select Existing or Type New --</option>';

        if (course) {
          const filteredTasks = backendData.tasks.filter(t => t.courseCode === course && t.categoryName === category);
          filteredTasks.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.taskName;
            opt.textContent = t.taskName;
            select.appendChild(opt);
          });
        }
        document.getElementById('taskInput').value = '';
      }

      function handleTaskSelect() {
        const select = document.getElementById('taskSelect');
        const input = document.getElementById('taskInput');
        if (select.value) {
          input.value = select.value;
        }
      }

      function clearSelect(selectId) {
        document.getElementById(selectId).value = '';
      }

      function showStatus(msg, isError) {
        const el = document.getElementById('status');
        el.style.display = 'block';
        el.innerText = msg;
        el.className = isError ? 'error' : 'success';
      }

      function showError(err) {
        showStatus(err.message || String(err), true);
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').innerText = 'Create / Open Workbook';
      }

      function submitForm() {
        const courseCode = document.getElementById('courseInput').value.trim();
        const categoryName = 'General';
        const taskName = document.getElementById('taskInput').value.trim();
        const year = document.getElementById('year').value;
        const rubricSelection = document.getElementById('rubricSelect').value;
        const newRubricName = document.getElementById('newRubricInput').value.trim();
        const fileInput = document.getElementById('rubricDocumentInput');

        if (!courseCode || !taskName || !year) {
          showStatus("Please fill in all course/task fields.", true);
          return;
        }

        var rubricDocument = null;
        if (rubricSelection === '__UPLOAD__') {
          if (!newRubricName) {
            showStatus("Please enter a name for the new rubric.", true);
            return;
          }
          if (!fileInput.files || fileInput.files.length === 0) {
             showStatus("Please select a PDF or Markdown file to upload.", true);
             return;
          }

          const file = fileInput.files[0];
          const reader = new FileReader();

          reader.onload = function(e) {
            const dataUrl = e.target.result;
            rubricDocument = {
              fileName: file.name,
              mimeType: file.type || getMimeTypeFromExt(file.name),
              base64: dataUrl.split(',')[1]
            };
            processSubmission(courseCode, categoryName, taskName, year, rubricSelection, newRubricName, rubricDocument);
          };

          reader.onerror = function() {
            showStatus("Failed to read the selected file.", true);
          };

          reader.readAsDataURL(file);
        } else {
          processSubmission(courseCode, categoryName, taskName, year, rubricSelection, newRubricName, rubricDocument);
        }
      }

      function getMimeTypeFromExt(filename) {
        if (filename.endsWith('.md')) return 'text/markdown';
        if (filename.endsWith('.txt')) return 'text/plain';
        if (filename.endsWith('.pdf')) return 'application/pdf';
        return 'application/octet-stream';
      }

      function processSubmission(courseCode, categoryName, taskName, year, rubricSelection, newRubricName, rubricDocument) {
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = 'Processing...';
        showStatus("Creating/opening workbook...", false);

        google.script.run
          .withSuccessHandler(function(res) {
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = 'Create / Open Workbook';
            if (res.success) {
              showStatus("Success! " + res.message, false);
              lastCreatedCourseCode = courseCode;
              lastCreatedTaskName = taskName;
              document.getElementById('linkClassroomBtn').style.display = 'block';
            } else {
              showStatus("Error: " + res.message, true);
              document.getElementById('linkClassroomBtn').style.display = 'none';
            }
          })
          .withFailureHandler(showError)
          .apiSubmitGradingWorkbookSetup(courseCode, categoryName, taskName, year, rubricSelection, newRubricName, rubricDocument);
      }

      function openCourseworkPicker() {
        if (!lastCreatedCourseCode || !lastCreatedTaskName) return;
        google.script.run.openClassroomPickerForTask(lastCreatedCourseCode, lastCreatedTaskName);
        google.script.host.close();
      }
    </script>
  </body>
</html>
