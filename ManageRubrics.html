<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 20px;
        color: #333;
      }
      h2 {
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 20px;
        color: #1a73e8;
      }
      .rubric-list {
        list-style-type: none;
        padding: 0;
      }
      .rubric-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid #eee;
      }
      .rubric-name {
        font-weight: 500;
        font-size: 14px;
      }
      .btn-group {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn-action {
        background-color: #f1f3f4;
        color: #1a73e8;
        border: 1px solid #dadce0;
        padding: 6px 12px;
        border-radius: 4px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .btn-action:hover {
        background-color: #e8f0fe;
      }
      .btn-action:disabled {
        color: #999;
        cursor: not-allowed;
      }
      .sync-status {
        font-size: 12px;
        margin-left: 5px;
      }
      .sync-success { color: #137333; }
      .sync-error { color: #c5221f; }
      #status {
        margin-top: 15px;
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h2>Manage Shared Rubrics</h2>
    <div id="status">Loading rubrics...</div>
    <ul id="rubricList" class="rubric-list"></ul>

    <script>
      window.onload = function() {
        google.script.run
          .withSuccessHandler(function(rubrics) {
            const list = document.getElementById('rubricList');
            const status = document.getElementById('status');

            if (!rubrics || rubrics.length === 0) {
              status.innerText = "No shared rubrics found. Create one during Task setup.";
              return;
            }

            status.style.display = 'none';

            rubrics.forEach(r => {
              const li = document.createElement('li');
              li.className = 'rubric-item';

              const nameSpan = document.createElement('span');
              nameSpan.className = 'rubric-name';
              nameSpan.textContent = r.name;

              const btnGroup = document.createElement('div');
              btnGroup.className = 'btn-group';

              const syncBtn = document.createElement('button');
              syncBtn.className = 'btn-action';
              syncBtn.textContent = 'Sync to Grading Engine';
              syncBtn.onclick = function() { syncRubric(r.id, syncBtn, statusSpan); };

              const openLink = document.createElement('a');
              openLink.className = 'btn-action';
              openLink.textContent = 'Open in Drive';
              openLink.href = 'https://docs.google.com/spreadsheets/d/' + r.id + '/edit';
              openLink.target = '_blank';

              const statusSpan = document.createElement('span');
              statusSpan.className = 'sync-status';

              btnGroup.appendChild(syncBtn);
              btnGroup.appendChild(openLink);
              btnGroup.appendChild(statusSpan);

              li.appendChild(nameSpan);
              li.appendChild(btnGroup);
              list.appendChild(li);
            });
          })
          .withFailureHandler(function(err) {
            document.getElementById('status').innerText = "Error loading rubrics: " + err.message;
            document.getElementById('status').style.color = '#d93025';
          })
          .apiListSharedRubrics();
      };

      function syncRubric(rubricId, btnElement, statusElement) {
        btnElement.disabled = true;
        btnElement.textContent = 'Syncing...';
        statusElement.textContent = '';
        statusElement.className = 'sync-status';

        google.script.run
          .withSuccessHandler(function(res) {
            btnElement.disabled = false;
            btnElement.textContent = 'Sync to Grading Engine';
            if (res.success) {
              statusElement.textContent = '✓ ' + res.message;
              statusElement.className = 'sync-status sync-success';
            } else {
              statusElement.textContent = '✗ ' + res.message;
              statusElement.className = 'sync-status sync-error';
            }
          })
          .withFailureHandler(function(err) {
            btnElement.disabled = false;
            btnElement.textContent = 'Sync to Grading Engine';
            statusElement.textContent = '✗ ' + err.message;
            statusElement.className = 'sync-status sync-error';
          })
          .apiRegenerateRubricSchema(rubricId);
      }
    </script>
  </body>
</html>
