<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f8fafc;
      color: #1e293b;
    }
    h2 { margin-top: 0; font-size: 18px; color: #0f172a; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    select, input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    .info-box {
      background: #e2e8f0;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .btn-group {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    button {
      padding: 9px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-msg { margin-top: 12px; font-size: 13px; font-weight: 500; }
    .success { color: #15803d; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <h2 id="pickerTitle">Select Google Classroom Assignment</h2>
  <div class="form-group">
    <label for="courseSelect">1. Select Classroom Course:</label>
    <select id="courseSelect">
      <option value="">-- Loading courses... --</option>
    </select>
  </div>

  <div class="form-group">
    <label for="assignmentSelect">2. Select Assignment / Coursework:</label>
    <select id="assignmentSelect" disabled>
      <option value="">-- Select a course first --</option>
    </select>
  </div>

  <div id="assignmentInfo" class="info-box">
    <div><b>Max Marks:</b> <span id="infoMaxPoints">-</span></div>
    <div><b>Due Date:</b> <span id="infoDueDate">-</span></div>
    <div><b>State:</b> <span id="infoState">-</span></div>
  </div>

  <div id="statusMsg" class="status-msg" role="status" aria-live="polite"></div>

  <div class="btn-group">
    <button id="cancelBtn" class="btn-secondary" type="button">Cancel</button>
    <button id="saveBtn" class="btn-primary" type="button" disabled>Save &amp; Set Active</button>
  </div>

  <script>
    var coursesMap = {};
    var assignmentsMap = {};
    // Apps Script evaluates this file with HtmlService.createTemplateFromFile(...).evaluate().
    var passedCourseCode = <?!= JSON.stringify(typeof passedCourseCode !== 'undefined' ? String(passedCourseCode) : '') ?>;
    var passedTaskName = <?!= JSON.stringify(typeof passedTaskName !== 'undefined' ? String(passedTaskName) : '') ?>;
    var courseLoadSequence = 0;

    function isUnevaluatedTemplateValue(value) {
      var text = String(value || '');
      return text.indexOf('<?') !== -1 || text.indexOf('?>') !== -1;
    }
    if (isUnevaluatedTemplateValue(passedCourseCode)) passedCourseCode = '';
    if (isUnevaluatedTemplateValue(passedTaskName)) passedTaskName = '';

    window.addEventListener('load', function() {
      if (passedTaskName) {
        document.getElementById('pickerTitle').textContent = 'Link Classroom to Task: ' + passedTaskName;
        document.getElementById('saveBtn').textContent = 'Link Assignment to Task';
      }
      document.getElementById('courseSelect').addEventListener('change', onCourseChanged);
      document.getElementById('assignmentSelect').addEventListener('change', onAssignmentChanged);
      document.getElementById('saveBtn').addEventListener('click', saveSelection);
      document.getElementById('cancelBtn').addEventListener('click', function() { google.script.host.close(); });
      loadCourses();
    });

    function showStatus(message, type, loading) {
      var el = document.getElementById('statusMsg');
      el.className = 'status-msg' + (type ? ' ' + type : '');
      el.replaceChildren();
      if (loading) {
        var spinner = document.createElement('span');
        spinner.className = 'spinner';
        spinner.setAttribute('aria-hidden', 'true');
        el.appendChild(spinner);
      }
      el.appendChild(document.createTextNode(message || ''));
    }

    function resetAssignments(label) {
      var select = document.getElementById('assignmentSelect');
      select.replaceChildren();
      select.add(new Option(label, ''));
      select.disabled = true;
      assignmentsMap = {};
      document.getElementById('saveBtn').disabled = true;
      document.getElementById('assignmentInfo').style.display = 'none';
    }

    function loadCourses() {
      showStatus('Loading your Google Classroom courses...', '', true);
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.success) {
            showStatus((res && res.message) || 'Could not load courses.', 'error');
            return;
          }
          var select = document.getElementById('courseSelect');
          select.replaceChildren();
          select.add(new Option('-- Choose a course --', ''));
          coursesMap = {};
          var courses = res.courses || [];
          if (!courses.length) {
            resetAssignments('-- No active courses found --');
            showStatus('No active Classroom courses found for your account.', 'error');
            return;
          }
          courses.forEach(function(c) {
            coursesMap[String(c.id)] = c;
            select.add(new Option(c.name + (c.section ? ' (' + c.section + ')' : ''), String(c.id)));
          });
          showStatus('', '');
          if (passedCourseCode) {
            var target = passedCourseCode.trim().toLowerCase();
            for (var i = 0; i < courses.length; i++) {
              var c = courses[i];
              if (String(c.id) === passedCourseCode ||
                  String(c.name || '').trim().toLowerCase() === target ||
                  String(c.section || '').trim().toLowerCase() === target) {
                select.value = String(c.id);
                onCourseChanged();
                break;
              }
            }
            if (!select.value) {
              showStatus('Select the Classroom course matching ' + passedCourseCode + '.', '');
            }
          }
        })
        .withFailureHandler(function(err) {
          showStatus('Error loading courses: ' + ((err && err.message) || String(err)), 'error');
        })
        .apiListTeacherCourses();
    }

    function onCourseChanged() {
      var courseId = document.getElementById('courseSelect').value;
      var aSelect = document.getElementById('assignmentSelect');
      var requestId = ++courseLoadSequence;
      resetAssignments(courseId ? '-- Loading assignments... --' : '-- Select a course first --');
      if (!courseId) {
        showStatus('', '');
        return;
      }
      showStatus('Loading coursework assignments...', '', true);
      google.script.run
        .withSuccessHandler(function(res) {
          if (requestId !== courseLoadSequence ||
              document.getElementById('courseSelect').value !== courseId) return;
          if (!res || !res.success) {
            resetAssignments('-- Unable to load coursework --');
            showStatus((res && res.message) || 'Could not load coursework.', 'error');
            return;
          }
          var cwList = res.coursework || [];
          resetAssignments(cwList.length ? '-- Choose an assignment --' : '-- No coursework found in this Classroom course --');
          if (!cwList.length) {
            showStatus('No coursework was returned for this Classroom course.', 'error');
            return;
          }
          cwList.forEach(function(cw) {
            if (!cw || cw.id == null) return;
            assignmentsMap[String(cw.id)] = cw;
            var dueLabel = cw.dueDate ? 'Due: ' + cw.dueDate : 'No due date — manual import only';
            var stateLabel = cw.state ? ' | ' + cw.state : '';
            var marks = cw.maxPoints == null ? 0 : cw.maxPoints;
            aSelect.add(new Option((cw.title || '(Untitled assignment)') +
              ' (' + marks + ' pts | ' + dueLabel + stateLabel + ')', String(cw.id)));
          });
          aSelect.disabled = false;
          showStatus(cwList.length + ' Classroom coursework item(s) available.', 'success');
        })
        .withFailureHandler(function(err) {
          if (requestId !== courseLoadSequence) return;
          resetAssignments('-- Unable to load coursework --');
          showStatus('Error loading coursework: ' + ((err && err.message) || String(err)), 'error');
        })
        .apiListCourseWork(courseId);
    }

    function onAssignmentChanged() {
      var cwId = document.getElementById('assignmentSelect').value;
      var cw = assignmentsMap[cwId];
      var infoBox = document.getElementById('assignmentInfo');
      if (!cw) {
        infoBox.style.display = 'none';
        document.getElementById('saveBtn').disabled = true;
        return;
      }
      document.getElementById('infoMaxPoints').textContent =
        (cw.maxPoints == null ? 0 : cw.maxPoints) + ' points';
      document.getElementById('infoDueDate').textContent =
        cw.dueDate ? cw.dueDate : 'No due date — manual import only';
      document.getElementById('infoState').textContent = cw.state || 'Unknown';
      infoBox.style.display = 'block';
      document.getElementById('saveBtn').disabled = false;
    }

    function saveSelection() {
      var courseId = document.getElementById('courseSelect').value;
      var cwId = document.getElementById('assignmentSelect').value;
      if (!courseId || !cwId || !assignmentsMap[cwId]) return;
      var btn = document.getElementById('saveBtn');
      btn.disabled = true;
      showStatus('Saving Classroom configuration...', '', true);
      var handler = google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            showStatus(assignmentsMap[cwId].dueDate
              ? 'Assignment linked. Hourly import applies when its due date arrives.'
              : 'Assignment linked. No due date: use manual import; hourly import will skip it.', 'success');
            setTimeout(function() { google.script.host.close(); }, 1200);
          } else {
            showStatus('Save failed: ' + ((res && res.message) || 'Unknown error'), 'error');
            btn.disabled = false;
          }
        })
        .withFailureHandler(function(err) {
          showStatus('Error saving selection: ' + ((err && err.message) || String(err)), 'error');
          btn.disabled = false;
        });
      if (passedTaskName) {
        handler.apiSaveClassroomSelectionForTask(courseId, cwId, passedTaskName);
      } else {
        handler.apiSaveClassroomSelection(courseId, cwId);
      }
    }
  </script>
</body>
</html>
